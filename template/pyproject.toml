[project]
# Rename: the project, the package under src/, and the entry point's name and target.
name = "luminary-connector-example"
version = "0.1.0"
description = "A starting point for a Luminary connector."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["luminary-source-sdk"]

[project.entry-points."luminary.connectors"]
# The name must equal what `describe` returns as `name`.
example = "luminary_example:Example"

[dependency-groups]
dev = ["pytest>=8.3"]

# Until the SDK is on PyPI, it comes from the Luminary repository at a pinned commit.
[tool.uv.sources]
luminary-source-sdk = { url = "https://github.com/nupsea/luminary/archive/69d48aeb3fb807e9a7e802c5d2ceaf27219f6ece.tar.gz", subdirectory = "packages/luminary-source-sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luminary_example"]

[tool.ruff]
line-length = 100
