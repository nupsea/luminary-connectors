name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  connector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        connector: [youtube, html-book, template]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Tests
        working-directory: ${{ matrix.connector }}
        run: uv run --locked pytest -q
