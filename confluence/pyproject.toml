[project]
name = "luminary-connector-confluence"
version = "0.1.0"
description = "A Confluence page and the pages under it, for Luminary: each page a section, in tree order."
license = "Apache-2.0"
requires-python = ">=3.11"
# Standard library only beside the SDK: nothing more to review for its licence.
dependencies = ["luminary-source-sdk"]

[project.entry-points."luminary.connectors"]
confluence = "luminary_confluence:Confluence"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
luminary-source-sdk = { url = "https://github.com/nupsea/luminary/archive/e20a65177cfd8e27edbf1bb240773c9494fb1e57.tar.gz", subdirectory = "packages/luminary-source-sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luminary_confluence"]

[tool.ruff]
line-length = 100
